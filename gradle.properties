# Project-wide Gradle settings.
#
# Toolchain compatibility matrix used by this project:
#   AGP 8.7.3  <->  Gradle 8.9+  <->  JDK 17..23
# Do NOT point the IDE at a Gradle 9.x installation: AGP 8.x is not
# compatible with Gradle 9 yet (it fails with "Cannot mutate the
# dependencies of configuration ... after the configuration was resolved").
# Always build through the Gradle wrapper (gradle/wrapper/gradle-wrapper.properties).
#
# AGP 8.x cannot run on a JDK 25 toolchain, so Gradle is pinned to the
# installed JDK 21 below (used by both the IDE and command-line builds).
org.gradle.java.home=C\:/Program Files/Eclipse Adoptium/jdk-21.0.12.101-hotspot

# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# JVM arguments for the Kotlin compile daemon.
kotlin.daemon.jvmargs=-Xmx2g

# Build performance.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX. Jetifier is disabled because the project has no legacy
# support-library dependencies, and Jetifier slows down every build.
android.useAndroidX=true
android.enableJetifier=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
